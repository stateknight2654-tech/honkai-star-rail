<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin nhân vật</title>
    <style>
        body { background: #0b0d13; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; padding: 25px; border: 1px solid #333; border-radius: 15px; background: #151821; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header { display: flex; gap: 20px; align-items: center; border-bottom: 2px solid #f3c316; padding-bottom: 20px; margin-bottom: 10px; }
        .char-portrait { width: 140px; height: 140px; border-radius: 12px; border: 2px solid #f3c316; object-fit: cover; }
        
        .build-section { 
            margin-top: 15px; 
            background: #1f232e; 
            padding: 15px 20px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .build-info { flex: 1; }
        h1 { color: #f3c316; margin: 0; font-size: 2.2em; }
        h3 { color: #f3c316; margin: 0 0 5px 0; font-size: 1.1em; }
        p { margin: 0; color: #e0e0e0; }

        /* Khung chứa ảnh món đồ build */
        .build-img { 
            width: 70px; 
            height: 70px; 
            object-fit: contain; 
            background: rgba(0,0,0,0.3); 
            border-radius: 10px; 
            padding: 5px;
            margin-left: 15px;
            border: 1px solid #444;
        }

        .back-btn { display: inline-block; margin-bottom: 20px; color: #f3c316; text-decoration: none; font-weight: bold; }
        .error-box { text-align: center; padding: 50px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Quay lại trang chủ</a>

    <div id="content" class="container">
        <h1 style="text-align:center;">Đang tải dữ liệu...</h1>
    </div>

    <script src="characters.js"></script> 

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const charId = params.get('id');
            const display = document.getElementById('content');

            // Kiểm tra dữ liệu
            if (typeof characterData !== 'undefined' && charId && characterData[charId]) {
                const data = characterData[charId];

                // Logic chọn ID ảnh: Nếu có relic_id thì dùng, không thì dùng charId làm mặc định
                const rID = data.relic_id || charId;
                const pID = data.planar_id || charId;

                display.innerHTML = `
                    <div class="header">
                        <img src="anh/characters/${charId}.webp" class="char-portrait" onerror="this.src='anh/characters/default.webp'">
                        <div class="info">
                            <h1>${data.name}</h1>
                            <p>Vận mệnh: <b>${data.path}</b> | Thuộc tính: <b>${data.element}</b></p>
                        </div>
                    </div>

                    <div class="build-section">
                        <div class="build-info">
                            <h3>🛡️ Di Vật khuyên dùng:</h3>
                            <p>${data.relics}</p>
                        </div>
                        <img src="anh/items/relics/${rID}.webp" class="build-img" onerror="this.style.display='none'">
                    </div>

                    <div class="build-section">
                        <div class="build-info">
                            <h3>💎 Phụ Kiện Vị Diện:</h3>
                            <p>${data.ornaments}</p>
                        </div>
                        <img src="anh/items/ornaments/${pID}.webp" class="build-img" onerror="this.style.display='none'">
                    </div>

                    <div class="build-section">
                        <div class="build-info">
                            <h3>⚔️ Nón Ánh Sáng:</h3>
                            <p>${data.lightCone}</p>
                        </div>
                        <img src="anh/items/lightcones/${charId}.webp" class="build-img" onerror="this.style.display='none'">
                    </div>

                    <div class="build-section">
                        <div class="build-info">
                            <h3>📊 Chỉ số ưu tiên:</h3>
                            <p>${data.stats}</p>
                        </div>
                    </div>
                `;
            } else {
                display.innerHTML = `
                    <div class="error-box">
                        <h1 style="color: #ff4d4d;">LỖI: KHÔNG TÌM THẤY DỮ LIỆU!</h1>
                        <p>ID trên link: <b>${charId || 'Trống'}</b> không khớp với file characters.js.</p>
                        <p>Vui lòng kiểm tra lại file <b>characters.js</b></p>
                    </div>`;
            }
        };
    </script>
</body>
</html>
